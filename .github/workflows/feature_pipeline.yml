name: Feature Pipeline (hourly)

on:
  schedule:
    - cron: "0 * * * *"   # every hour on the hour
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-feature.txt

      - name: Install dependencies
        run: pip install -r requirements-feature.txt

      - name: Run feature pipeline
        env:
          AQICN_API_KEY:       ${{ secrets.AQICN_API_KEY }}       # FILL IN: add to GitHub repo Secrets
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }} # FILL IN: add to GitHub repo Secrets
          MONGODB_URI:         ${{ secrets.MONGODB_URI }}         # FILL IN: Atlas SRV connection string
          MONGODB_DB_NAME:     ${{ secrets.MONGODB_DB_NAME }}
          DEFAULT_CITY:        "karachi"
          MLFLOW_TRACKING_URI: "mlruns"
        run: python src/feature_pipeline/pipeline.py

      - name: Precompute 3-day forecast for the dashboard
        env:
          AQICN_API_KEY:       ${{ secrets.AQICN_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          MONGODB_URI:         ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME:     ${{ secrets.MONGODB_DB_NAME }}
          DEFAULT_CITY:        "karachi"
        run: python src/feature_pipeline/predict.py

      - name: Send drift alert email (if PSI > 0.2)
        if: failure() && env.ALERT_EMAIL != ''
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "AQI Pipeline: Data Drift Alert"
          body: "PSI drift threshold exceeded in the AQI feature pipeline. Check the drift dashboard."
          to: ${{ secrets.ALERT_EMAIL }}
          from: AQI Predictor Bot
