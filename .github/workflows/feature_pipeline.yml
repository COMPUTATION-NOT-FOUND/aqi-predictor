name: Feature Pipeline (hourly)

on:
  schedule:
    - cron: "0 * * * *"   # every hour on the hour
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          AQICN_API_KEY:       ${{ secrets.AQICN_API_KEY }}       # FILL IN: add to GitHub repo Secrets
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }} # FILL IN: add to GitHub repo Secrets
          HOPSWORKS_API_KEY:   ${{ secrets.HOPSWORKS_API_KEY }}   # FILL IN: add to GitHub repo Secrets
          HOPSWORKS_PROJECT:   ${{ secrets.HOPSWORKS_PROJECT }}
          DEFAULT_CITY:        "karachi"
          MLFLOW_TRACKING_URI: "mlruns"
        run: python src/feature_pipeline/pipeline.py

      - name: Send drift alert email (if PSI > 0.2)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}   # FILL IN: optional — add email secrets if you want alerts
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "AQI Pipeline: Data Drift Alert"
          body: "PSI drift threshold exceeded in the AQI feature pipeline. Check the drift dashboard."
          to: ${{ secrets.ALERT_EMAIL }}
          from: AQI Predictor Bot
